<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lobyas is offline</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Lobyas needs a connection to load your terms. Check your network and try again.</p>
      <button type="button" onclick="location.href = 'https://lobyas.com/'">Try again</button>
    </main>
    <script>
      // This page has no app code, so it hides the launch splash itself instead of leaving it up
      // until the safety timeout.
      try {
        window.Capacitor.nativePromise("SplashScreen", "hide", {}).catch(function () {});
      } catch (e) {}
    </script>
  </body>
</html>
