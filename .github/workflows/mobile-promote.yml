# Sends the latest beta build to the public stores: Android moves the Play internal release
# to production at a staged percentage, iOS submits the TestFlight build for App Store
# review as a phased release. Both upload the store listing text from fastlane/metadata first.
# With "submit" off they only upload and check the text. Start it with `pnpm mobile:promote`.
# See docs/mobile.md.
name: Mobile promote

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store
        type: choice
        options: [both, android, ios]
        default: both
      version:
        description: Version of the build to promote, e.g. 1.2.3 (iOS)
        type: string
        required: true
      rollout:
        description: Percent of Android users to start with (1-100)
        type: string
        default: "10"
      submit:
        description: "Submit for review and promote (off: only upload and check the store text)"
        type: boolean
        default: true

concurrency:
  group: mobile-promote

permissions:
  contents: read

jobs:
  android-promote:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    environment: Mobile release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Promote the internal release to production
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ROLLOUT: ${{ inputs.rollout }}
          SUBMIT: ${{ inputs.submit }}
        run: bundle exec fastlane android promote rollout:"$ROLLOUT" submit:"$SUBMIT"

  ios-promote:
    if: inputs.platform != 'android'
    runs-on: ubuntu-latest
    environment: Mobile release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Submit the TestFlight build for review
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          VERSION: ${{ inputs.version }}
          SUBMIT: ${{ inputs.submit }}
        run: bundle exec fastlane ios promote version:"$VERSION" submit:"$SUBMIT"
