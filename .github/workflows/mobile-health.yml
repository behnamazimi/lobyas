# Monthly check that the next mobile release will work: the signing secrets, the signing repo,
# the App Store Connect key and the profile's expiry. A failure reaches the DevOps Telegram
# chat. See docs/mobile.md.
name: Mobile health

on:
  schedule:
    - cron: "43 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing:
    # match imports the certificate into a keychain, which only exists on macOS.
    runs-on: macos-latest
    timeout-minutes: 20
    environment: Mobile release
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Check the secrets and the signing repo
        run: scripts/check-signing-secrets.sh
      - name: Check the App Store Connect key and the signing profile
        run: bundle exec fastlane ios health
      - name: Tell the DevOps chat
        if: failure()
        env:
          TELEGRAM_OPS_BOT_TOKEN: ${{ secrets.TELEGRAM_OPS_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          MESSAGE: "⚠️ The mobile release setup needs attention (signing, the App Store Connect key or the profile): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: scripts/notify-telegram.sh
